name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # sops release binary, verified by SHA-256 (value from the release's
  # sops-v3.13.3.checksums.txt). Update both together.
  SOPS_VERSION: "3.13.3"
  SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint and typing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: mypy --strict
        run: uv run mypy --strict src
      - name: Secret scan
        run: scripts/scan-secrets.sh
      - name: ASCII only in src
        run: "! grep -rnP '[^\\x00-\\x7F]' src"

  test:
    name: Python ${{ matrix.python }}, Dynaconf ${{ matrix.dynaconf }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dynaconf: [lowest, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Install sops (SHA-256 verified)
        run: |
          url="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sops" "$url"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/sops" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops
          sops --disable-version-check --version
      - name: Select Dynaconf
        run: |
          if [ "${{ matrix.dynaconf }}" = lowest ]; then
            lowest=$(sed -n 's/.*"dynaconf>=\([0-9.]*\),.*/\1/p' pyproject.toml)
            echo "DYNACONF_SPEC=dynaconf==$lowest" >> "$GITHUB_ENV"
          else
            echo "DYNACONF_SPEC=dynaconf<4" >> "$GITHUB_ENV"
          fi
      - run: uv sync --locked
      - name: Tests with coverage
        run: >-
          uv run --with "$DYNACONF_SPEC" pytest -q
          --cov --cov-report=term --cov-fail-under=90
      - name: Examples
        if: matrix.dynaconf == 'latest'
        run: for script in examples/*/run.sh; do bash "$script"; done

  build:
    name: Build and twine check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
