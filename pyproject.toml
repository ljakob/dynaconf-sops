[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dynaconf-sops"
version = "0.1.0"
description = "Lazy @sops token for Dynaconf: reference values in SOPS-encrypted files directly from your settings."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Leif Jakob", email = "leif.jakob@gmail.com" }]
keywords = ["dynaconf", "sops", "secrets", "configuration", "age"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["dynaconf>=3.2.2,<4"]

[project.urls]
Homepage = "https://github.com/ljakob/dynaconf-sops"
Documentation = "https://github.com/ljakob/dynaconf-sops/tree/main/docs"
Repository = "https://github.com/ljakob/dynaconf-sops"
Issues = "https://github.com/ljakob/dynaconf-sops/issues"
Changelog = "https://github.com/ljakob/dynaconf-sops/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jinja2>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dynaconf_sops"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S607"]
"examples/**" = ["S101", "S105", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["dynaconf", "dynaconf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.coverage.run]
source = ["dynaconf_sops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
